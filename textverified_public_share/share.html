<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>短信记录</title><style>body{font:16px Arial;max-width:760px;margin:25px auto;padding:0 14px;color:#222}.sms{border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0}.muted{color:#777;font-size:13px}pre{white-space:pre-wrap;word-break:break-word}</style><h2>短信记录</h2><div id="number"></div><div id="status" class="muted">正在加载…</div><div id="list"></div><script>
const token=location.pathname.split('/').pop();function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){try{let r=await fetch('/api/share/'+token+'/sms');let j=await r.json();if(!r.ok)throw Error(j.detail||'加载失败');document.getElementById('number').textContent=j.number;let a=j.items||[];document.getElementById('status').textContent='自动刷新中 · '+new Date().toLocaleString();document.getElementById('list').innerHTML=a.map(x=>`<div class="sms"><div class="muted">${esc(x.createdAt||'')}　来自：${esc(x.from||'')}</div><p>${esc(x.smsContent||x.message||'')}</p>${x.parsedCode?'<b>验证码：'+esc(x.parsedCode)+'</b>':''}</div>`).join('')||'<p>暂时没有短信</p>'}catch(e){document.getElementById('status').textContent=e.message}}
refresh();setInterval(refresh,10000);
</script>
